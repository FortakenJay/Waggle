<svg xmlns="http://www.w3.org/2000/svg" width="760" height="551" viewBox="0 0 760 551" role="img" aria-labelledby="title desc">
  <title id="title">waggle terminal output</title>
  <desc id="desc">Verified output from $ waggle --help</desc>
  <rect width="760" height="551" rx="12" fill="#0d1117"/>
  <circle cx="20" cy="20" r="5" fill="#ff5f57"/>
  <circle cx="38" cy="20" r="5" fill="#febc2e"/>
  <circle cx="56" cy="20" r="5" fill="#28c840"/>
  <style>
    text { font: 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; white-space: pre; }
    .command { fill: #79c0ff; }
    .output { fill: #e6edf3; }
  </style>
<text x="28" y="54" class="command">$ waggle --help</text>
<text x="28" y="75" class="output"> </text>
<text x="28" y="96" class="output">waggle — spoken work → GitHub issues</text>
<text x="28" y="117" class="output"> </text>
<text x="28" y="138" class="output">Commands:</text>
<text x="28" y="159" class="output">  fixture &lt;file.json&gt;                 process a saved fixture</text>
<text x="28" y="180" class="output">  conv &lt;id&gt;                           process one Bee conversation</text>
<text x="28" y="201" class="output">  latest [count]                      process recent conversations (default 5)</text>
<text x="28" y="222" class="output">  watch                               process completed Bee conversations</text>
<text x="28" y="243" class="output">  repos                               list cached repository profiles</text>
<text x="28" y="264" class="output">  repos refresh                       rediscover and profile repositories</text>
<text x="28" y="285" class="output">  inbox                               list review entries</text>
<text x="28" y="306" class="output">  inbox assign &lt;n&gt; &lt;owner/repo&gt;</text>
<text x="28" y="327" class="output">  inbox drop &lt;n&gt;</text>
<text x="28" y="348" class="output"> </text>
<text x="28" y="369" class="output">Flags:</text>
<text x="28" y="390" class="output">  --dry-run                           block every GitHub mutation</text>
<text x="28" y="411" class="output">  --verbose                           print rendered issue bodies</text>
<text x="28" y="432" class="output">  --force                             re-extract processed conversations</text>
<text x="28" y="453" class="output">  --debug                             log one raw Bee payload</text>
<text x="28" y="474" class="output">  --min-confidence &lt;0..1&gt;             extraction threshold (default 0.5)</text>
<text x="28" y="495" class="output"> </text>
<text x="28" y="516" class="output">Without GITHUB_TOKEN, processing is automatically dry-run.</text>
</svg>
