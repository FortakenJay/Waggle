<svg xmlns="http://www.w3.org/2000/svg" width="760" height="152" viewBox="0 0 760 152" role="img" aria-labelledby="title desc">
  <title id="title">waggle terminal output</title>
  <desc id="desc">Verified output from $ waggle inbox --dry-run</desc>
  <rect width="760" height="152" rx="12" fill="#0d1117"/>
  <circle cx="20" cy="20" r="5" fill="#ff5f57"/>
  <circle cx="38" cy="20" r="5" fill="#febc2e"/>
  <circle cx="56" cy="20" r="5" fill="#28c840"/>
  <style>
    text { font: 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; white-space: pre; }
    .command { fill: #79c0ff; }
    .output { fill: #e6edf3; }
  </style>
<text x="28" y="54" class="command">$ waggle inbox --dry-run</text>
<text x="28" y="75" class="output"> </text>
<text x="28" y="96" class="output">(dry run — every GitHub mutation is blocked)</text>
<text x="28" y="117" class="output">Inbox is empty.</text>
</svg>
